{% load static %}

<nav class="navbar has-background" role="navigation" aria-label="main navigation">
    <div class="navbar-brand">
        <a class="navbar-item" href="{% url "WebPage:Pages:index" %}">
            <img src="{% static "/img/favicon.ico" %}" alt="Logo" style="max-height: 3rem;">
        </a>

        <a role="button" class="navbar-burger" aria-label="menu" aria-expanded="false" data-target="navMenu">
            <span aria-hidden="true"></span>
            <span aria-hidden="true"></span>
            <span aria-hidden="true"></span>
        </a>
    </div>

    <div id="navMenu" class="navbar-menu">
        <div class="navbar-start">

            <a class="navbar-item" href="{% url "Entries:Explorer:book_start" %}">View Entries</a>
        </div>

        <div class="navbar-end">
            <div class="navbar-item">
                <div class="buttons">
                    <a class="button is-primary" href="{% url "Entries:Entry:new" %}">+ Create Entry</a>
                </div>
            </div>
            <div class="navbar-item has-dropdown is-hoverable">
                <a class="navbar-link" href="{% url "WebPage:User:account" %}">Account</a>
                <div class="navbar-dropdown is-right">
                    {% if request.user.is_authenticated %}
                        <a class="navbar-item" href="{% url "WebPage:User:account" %}">Manage</a>
                        <a class="navbar-item" href="{% url "WebPage:User:logout" %}">Log out</a>
                    {% else %}
                        <a class="navbar-item" href="{% url "WebPage:User:login" %}">Log in</a>
                        <a class="navbar-item" href="{% url "WebPage:User:register" %}">Sign up</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</nav>

<!-- Optional JS to toggle burger on small screens -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
    const burgers = Array.prototype.slice.call(document.querySelectorAll('.navbar-burger'), 0);
    burgers.forEach((el) => {
    el.addEventListener('click', () => {
    const target = el.dataset.target;
    const menu = document.getElementById(target);
    el.classList.toggle('is-active');
    menu.classList.toggle('is-active');
    });
    });
    });
</script>
