  <style>
    .editor-layout {
        height: 100%;
    }

    .editor-content {
      height: 100%;
      padding: 1rem;
      background: #fafafa;
      overflow: auto;
    }

    /* Sidebar styles */
    .sidebar {
      height: 100%;
      border-left: 1px solid #dbdbdb;
      background: #fff;
      transition: width 0.2s ease;
      overflow: hidden;
    }

    .sidebar.is-collapsed {
      width: 0 !important;
      border-left: none;
    }

    .sidebar-inner {
      width: 260px; /* fixed width when open */
      padding: 1rem;
    }

    .editor-area {
      width: 100%;
      height: 100%;
      border: none;
      resize: none;
      font-family: monospace;
      font-size: 14px;
      outline: none;
    }
  </style>

{% extends "main/main.html" %}

  {% block main %}
<div class="columns is-gapless editor-layout">
  <!-- Editor content (majority of screen) -->
  <div class="column">
    <div class="editor-content">
      <textarea class="editor-area" placeholder="Start typing here..."></textarea>
    </div>
  </div>

  <!-- Collapsible right sidebar -->
  <div id="sidebar" class="column is-narrow sidebar">
    <div class="sidebar-inner">
      <p class="title is-5">Tools</p>
      <aside class="menu">
        <p class="menu-label">
          Files
        </p>
        <ul class="menu-list">
          <li><a>index.html</a></li>
          <li><a>styles.css</a></li>
          <li><a>script.js</a></li>
        </ul>
        <p class="menu-label">
          Actions
        </p>
        <ul class="menu-list">
          <li><a>Format</a></li>
          <li><a>Find & Replace</a></li>
          <li><a>Settings</a></li>
        </ul>
      </aside>
    </div>
  </div>
</div>

<!-- Optional: Font Awesome for icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<script>
  const toggleBtn = document.getElementById('toggleSidebar');
  const sidebar = document.getElementById('sidebar');

  toggleBtn.addEventListener('click', () => {
    sidebar.classList.toggle('is-collapsed');
  });
</script>
  {% endblock %}
