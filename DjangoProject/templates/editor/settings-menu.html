<style>
    #settings_container {
        position: absolute;
        top: 160px;
        z-index: 1000;
        background-color: var(--color-bg-elevated);
        border: 1px solid var(--color-border-strong);
        border-radius: var(--radius-md);
        overflow: hidden;
    }
  #move {
      cursor: move;
  }
  #settings_container label{
      text-align: center;
      align-content: center;
      padding: 5px;
  }
  #settings-toggle {
      display: none;
  }
    .window-toolbar {
        border-bottom: 1px solid var(--color-border-strong);
    }
  #settings-toggle-label {
      background-color: var(--color-danger);
  }
    #settings-toggle-label:hover {
      background-color: var(--color-danger-hover);
  }
</style>

<div class="box-v" id="settings_container">
    <div class="box-h window-toolbar">
        <div class="box-h-center" id="move">⚙️ Settings Menu ⚙️</div>
        <input id="settings-toggle" type="checkbox">
        <label for="settings-toggle" id="settings-toggle-label">✖️️</label>
    </div>
    <div id="settings-menu">
        <div class="box-v basic-spacing">
            {% block menu-content %}
                {% include "editor/entry_settings_form.html" %}
                {% include "editor/customization_form.html" %}
            {% endblock %}
        </div>
    </div>
</div>

<script>
    dragElement(document.getElementById("settings_container"));

    function dragElement(element) {
      let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
      const header = document.getElementById("move");
      if (header) {
        header.onmousedown = dragMouseDown;
      } else {
        element.onmousedown = dragMouseDown;
      }

      function dragMouseDown(e) {
        e.preventDefault();
        pos3 = e.clientX;
        pos4 = e.clientY;
        document.onmouseup = closeDragElement;
        document.onmousemove = elementDrag;
      }

      function elementDrag(e) {
        e.preventDefault();
        pos1 = pos3 - e.clientX;
        pos2 = pos4 - e.clientY;
        pos3 = e.clientX;
        pos4 = e.clientY;
        element.style.top = (element.offsetTop - pos2) + "px";
        element.style.left = (element.offsetLeft - pos1) + "px";
      }

      function closeDragElement() {
        document.onmouseup = null;
        document.onmousemove = null;
      }
    }
</script>
