<div class="card" id="news_feed_panel-frame">
    <div class="card-content" id="news_feed-panel">
        <div class="card-header" id="news_feed-toolbar">
            <h3>News Feed</h3>
        </div>
        <div class="content" id="news_feed-root">
            <p hx-get="{% url "Blog:news_feed" %}" hx-trigger="load" hx-target="this" hx-swap="outerHTML">
                Unable to load news feed.
            </p>
        </div>
        <div class="card-footer">
            <a class="button" href="{% url "Blog:browser" %}">Browse</a>
            <button class="button" hx-get="{% url "Blog:news_feed" %}" hx-target="#news_feed-root">Refresh</button>
        </div>
    </div>
</div>
